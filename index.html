<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Team Participation Counter</title>
  <style>
    :root { --bg:#0b0f17; --card:#121a2a; --text:#e8eefc; --muted:#a9b6d3; --line:#24314f; }
    body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
           background: linear-gradient(180deg, #070a10, var(--bg)); color: var(--text); }
    .wrap { max-width: 760px; margin: 40px auto; padding: 0 16px; }
    .card { background: rgba(18,26,42,.92); border: 1px solid rgba(36,49,79,.8);
            border-radius: 16px; padding: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.35); }
    h1 { font-size: 18px; margin: 0 0 6px; }
    .sub { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .row { display: grid; grid-template-columns: 1fr auto; gap: 12px;
           padding: 12px 0; border-top: 1px solid rgba(36,49,79,.65); }
    .row:first-of-type { border-top: 0; }
    .name { font-weight: 600; }
    .meta { color: var(--muted); font-size: 12px; margin-top: 4px; }
    .controls { display: flex; align-items: center; gap: 10px; }
    button { width: 38px; height: 38px; border-radius: 10px; border: 1px solid rgba(36,49,79,.9);
             background: #0c1322; color: var(--text); font-size: 18px; cursor: pointer; }
    button:hover { filter: brightness(1.15); }
    button:active { transform: translateY(1px); }
    .count { min-width: 22px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 700; }
    .bar { height: 10px; border-radius: 999px; background: rgba(36,49,79,.6); overflow: hidden;
           border: 1px solid rgba(36,49,79,.9); margin-top: 8px; }
    .fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6aa8ff, #7cf0ff); }
    .footer { display:flex; gap:10px; flex-wrap:wrap; margin-top: 14px; }
    .smallbtn { width: auto; padding: 10px 12px; font-size: 13px; border-radius: 12px; }
    .hint { color: var(--muted); font-size: 12px; margin-top: 10px; line-height: 1.35; }
    code { background: rgba(255,255,255,.06); padding: 2px 6px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>Team Participation Counter</h1>
      <div class="sub">Track how many discussion topics each person brings up. Goal: <span id="goalText"></span> each.</div>

      <div id="list"></div>

      <div class="footer">
        <button class="smallbtn" id="reset">Reset all to 0</button>
        <button class="smallbtn" id="copy">Copy summary</button>
      </div>

      <div class="hint">
        Saved locally in your browser via <code>localStorage</code>. Counts persist on this computer in this browser.
      </div>
    </div>
  </div>

  <script>
    const GOAL = 10;
    const NAMES = ["Amal", "Billy", "Imani", "Sam", "Sissi"];

    const STORAGE_KEY = "participation_counts_v1";

    function loadCounts() {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return Object.fromEntries(NAMES.map(n => [n, 0]));
      try {
        const parsed = JSON.parse(raw);
        return Object.fromEntries(NAMES.map(n => [n, Number(parsed?.[n] ?? 0)]));
      } catch {
        return Object.fromEntries(NAMES.map(n => [n, 0]));
      }
    }

    function saveCounts(counts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(counts));
    }

    let counts = loadCounts();

    const list = document.getElementById("list");
    const goalText = document.getElementById("goalText");
    goalText.textContent = GOAL;

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    function render() {
      list.innerHTML = "";
      NAMES.forEach(name => {
        const value = counts[name] ?? 0;
        const pct = clamp((value / GOAL) * 100, 0, 100);

        const row = document.createElement("div");
        row.className = "row";

        const left = document.createElement("div");
        left.innerHTML = `
          <div class="name">${name}</div>
          <div class="meta">${value}/${GOAL}</div>
          <div class="bar"><div class="fill" style="width:${pct}%"></div></div>
        `;

        const controls = document.createElement("div");
        controls.className = "controls";

        const minus = document.createElement("button");
        minus.textContent = "−";
        minus.onclick = () => {
          counts[name] = clamp((counts[name] ?? 0) - 1, 0, GOAL);
          saveCounts(counts);
          render();
        };

        const countEl = document.createElement("div");
        countEl.className = "count";
        countEl.textContent = value;

        const plus = document.createElement("button");
        plus.textContent = "+";
        plus.onclick = () => {
          counts[name] = clamp((counts[name] ?? 0) + 1, 0, GOAL);
          saveCounts(counts);
          render();
        };

        controls.appendChild(minus);
        controls.appendChild(countEl);
        controls.appendChild(plus);

        row.appendChild(left);
        row.appendChild(controls);
        list.appendChild(row);
      });
    }

    document.getElementById("reset").onclick = () => {
      counts = Object.fromEntries(NAMES.map(n => [n, 0]));
      saveCounts(counts);
      render();
    };

    document.getElementById("copy").onclick = async () => {
      const lines = NAMES.map(n => `${n}: ${counts[n] ?? 0}/${GOAL}`);
      const text = `Participation (${new Date().toLocaleDateString()}):\n` + lines.join("\n");
      try {
        await navigator.clipboard.writeText(text);
        alert("Copied summary to clipboard!");
      } catch {
        prompt("Copy this summary:", text);
      }
    };

    render();
  </script>
</body>
</html>
